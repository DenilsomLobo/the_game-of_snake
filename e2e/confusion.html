<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#173523}</style></head><body><div id="board"></div><script type="module">
import Phaser from 'phaser';
import {Terrarium} from '/src/game/scene.js';
import {Engine} from '/src/game/engine.js';
class Fixture extends Terrarium{
 create(){super.create();const engine=new Engine('brown');engine.food={x:7,y:10,type:'reverse'};engine.step();this.game.registry.set('engine',engine);window.fixtureScene=this;window.artReady=true;}
 update(time){super.update(time,0);}
}
new Phaser.Game({type:Phaser.CANVAS,parent:'board',width:640,height:640,scene:Fixture,banner:false});
</script></body></html>
